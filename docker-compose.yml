services:
  postgres:
    image: postgres:15-alpine
    container_name: victim_postgres
    environment:
      POSTGRES_DB: victim_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: postgres -c max_connections=100 -c track_activities=on
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d victim_db"]
      interval: 2s
      timeout: 2s
      retries: 20

  victim_service:
    build: .
    container_name: victim_service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: victim_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DJANGO_SECRET_KEY: dev-victim-secret-key-12345
    ports:
      - "8001:8001"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
